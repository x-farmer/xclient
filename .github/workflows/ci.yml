name: component-ci

on:
  push:
    branches-ignore: [main, dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, component-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: skills/validate/scripts/validate.sh --install
